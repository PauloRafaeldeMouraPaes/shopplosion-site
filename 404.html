<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Shopplosion</title>
<link rel="icon" href="/favicon.ico" sizes="any">

<style>
:root{--ink:#111827;--ink2:#5b6478;--brand-ink:#c8185f;--grad:linear-gradient(112deg,#ffc400 0%,#ff9d20 25%,#ff4b58 52%,#f50075 78%,#d90091 100%)}

header img{height:44px;width:auto;display:block}
main{max-width:780px;margin:auto;padding:72px 20px 96px}

p{color:var(--ink2);font-size:17px;margin:0 0 28px}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 20px;border-radius:8px;background:var(--brand-ink);color:#fff;font-weight:700;text-decoration:none}

</head>
